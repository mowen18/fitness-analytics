[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "running-pipeline"
version = "0.1.0"
description = "Incremental Strava + weather analytics pipeline (see docs/PROJECT_PLAN.md)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "pydantic-settings>=2.6",
    "click>=8.1",
    "psycopg[binary]>=3.2",
    "dbt-core>=1.9",
    "dbt-postgres>=1.9",
    "streamlit>=1.40",
    "altair>=5.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "responses>=0.25",
    "ruff>=0.8",
]

[project.scripts]
running-pipeline = "running_pipeline.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/running_pipeline"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the local dockerized Postgres (start it with `make up`)",
    "dbt_running: dbt integration tests for the running domain (runs, drift, bands, weather matching)",
    "dbt_cycling: dbt integration tests for the cycling domain (rides, segments, wind)",
    "app: Streamlit render tests against the scratch database",
]
