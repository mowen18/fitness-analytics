# dbt project (decision D4: lives in dbt/, never the repo root; all dbt
# commands are wrapped in Makefile targets so path handling never leaks
# into the daily workflow).

name: running_analytics
version: "1.0.0"
profile: running_analytics

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

target-path: target
clean-targets: [target, dbt_packages]

# Metric thresholds (D9 as revised by v1.1 data-validity rules, D12,
# D13 + the agreed 45-minute long-run rule). Overridable with --vars,
# never hardcoded in model SQL.
vars:
  valid_run_min_moving_minutes: 15
  pace_min_per_mi_floor: 4.0
  pace_min_per_mi_ceiling: 20.0
  hr_sanity_floor: 90
  hr_sanity_ceiling: 200
  long_run_min_moving_minutes: 45
  min_weekly_valid_runs: 2
  trend_window_days: 28
  # Drift analysis window (D16) and the two checks D16 left
  # unquantified, settled as: coverage = average sample spacing within
  # the window <= 3 s; excessive pauses = non-moving share > 25%.
  drift_warmup_minutes: 10
  drift_cooldown_minutes: 5
  drift_min_window_minutes: 30
  drift_max_avg_sample_gap_s: 3
  drift_max_paused_fraction: 0.25
  # D22 pace-at-HR-band analysis window (Revision v1.4). The fetch-gate
  # var is the dbt-side twin of the Python setting of the same name
  # (band candidacy: HR-carrying runs past the stream FETCH gate);
  # drift candidacy keeps long_run_min_moving_minutes unchanged. Trims
  # are lighter than drift's so a 20-minute run survives them; the
  # coverage cap is drift_max_avg_sample_gap_s, reused not duplicated.
  stream_fetch_min_moving_minutes: 20
  band_warmup_trim_minutes: 5
  band_cooldown_trim_minutes: 2
  band_min_window_minutes: 10
  band_min_dwell_minutes: 5
  # Cycling domain, Phase C1 (v2.0: D23 ride grain, D25 ride validity,
  # D12-spirit weekly sufficiency). The Python-side twin of
  # ride_sport_types is RIDE_SPORT_TYPES in coordinate/weather
  # ingestion (weather deliberately excludes VirtualRide — indoor).
  # The ride HR sanity rung reuses hr_sanity_floor/ceiling above: one
  # mechanism, two consumers, the drift-coverage-var precedent.
  ride_sport_types: ['Ride', 'MountainBikeRide', 'GravelRide', 'VirtualRide']
  valid_ride_min_moving_minutes: 15
  ride_speed_mph_floor: 3
  ride_speed_mph_ceiling: 35
  min_weekly_valid_rides: 2
  # Cycling segments, Phase C2 (D28: rolling 5-effort median, >= 5
  # efforts for trend display, < 120 s median = short-segment noise
  # flag). Names follow the D28 decision record verbatim —
  # short_segment_seconds deliberately keeps the recorded spelling
  # over the _s suffix convention.
  segment_rolling_effort_window: 5
  segment_trend_min_efforts: 5
  short_segment_seconds: 120
  # Headwind context, Phase C3 (D30: segments strictly above this
  # sinuosity carry the displayed winding_segment flag — the
  # straight-line bearing misdescribes them — never a filter). Name
  # follows the D30 decision record verbatim.
  winding_sinuosity_max: 1.3

# Layers map onto the five locked schemas (D3). generate_schema_name is
# overridden so these names are used exactly, without dbt's default
# <target>_<schema> prefixing.
models:
  running_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    core:
      +materialized: table
      +schema: analytics
    marts:
      +materialized: table
      +schema: analytics
