version: 2

models:
  - name: int_runs_with_weather
    description: >
      One row per running activity (Run/TrailRun/VirtualRun — same
      grain fct_runs inherits), joined to the NEAREST qualifying hourly
      observation at the run's normalized D7 cell. Qualifying means the
      observation carries at least one measurement; the explicit
      all-NULL "archive had no data" rows never match. The model records
      the match time-difference and flags weather_matched only within
      60 minutes of the start — beyond that the observation no longer
      describes the run's start conditions. Indoor and coordinate-less
      runs remain in the grain, permanently unmatched, with NULL weather
      — missing stays distinguishable from zero.
    columns:
      - name: activity_id
        description: Strava activity id (one row per running activity).
        tests: [unique, not_null]
      - name: location_key
        description: >
          The run's normalized ~1.1 km cell (D7), derived in SQL to
          mirror ingestion's Python formatting; NULL when the run has no
          GPS coordinates.
      - name: weather_timestamp
        description: UTC hour of the nearest qualifying observation; NULL when none exists.
      - name: weather_match_minutes
        description: >
          Minutes between the run start and the matched observation
          hour; NULL when no observation exists at the cell.
        tests:
          - accepted_range:
              arguments: {min_value: 0}
      - name: weather_matched
        description: True only when a qualifying observation lies within 60 minutes.
        tests: [not_null]

  - name: int_run_efficiency
    description: >
      One row per running activity — the run-level computation layer
      (Revision v1.2): the derived training measures (pace, speed,
      distance, calendar fields, the duration-based long-run flag —
      previously computed in fct_runs), the D10 aerobic-efficiency
      metric, and the run's validity verdict (D9 revised v1.1:
      data-validity rules only — no intensity ceiling, no race/workout
      exclusion). is_valid is DEFINED as (exclusion_reason is null);
      the exclusion ladder is the single encoding of the rules. Invalid
      runs are NEVER silently filtered: each carries a human-readable
      exclusion_reason (the FIRST failing rule in priority order: data
      availability, HR sanity, pace bounds, minimum duration). Feeds
      fct_runs, which projects this model into core for the marts; as
      fct_runs' only parent it also carries the weather context (the
      matched observation and match flag) through from
      int_runs_with_weather.
      Efficiency is an observational signal, not proof of physiological
      improvement — approved framing lives in the README's metric
      definitions.
    columns:
      - name: activity_id
        description: Strava activity id (one row per running activity).
        tests: [unique, not_null]
      - name: aerobic_efficiency_m_per_heartbeat
        description: >
          speed_m_per_min / average_hr_bpm (D10) — approximate meters
          traveled per heartbeat; higher = faster at the same HR or
          lower HR at the same speed. Computed for any run with HR and
          speed (races included); is_valid decides what the marts
          aggregate. NULL when HR is absent — missing, never zero.
        tests:
          - accepted_range:
              arguments: {min_value: 0.1, max_value: 10}
      - name: is_valid
        description: >
          The run carries valid HR data and counts toward every
          efficiency aggregate (D9 revised v1.1: HR present, HR within
          the sanity band, pace within bounds, moving time at least the
          minimum — thresholds as dbt vars).
        tests: [not_null]
      - name: exclusion_reason
        description: >
          NULL when valid; otherwise the first failing validity rule.
          Threshold values are rendered from the same dbt vars the flag
          logic uses, so reasons can never disagree with behavior.
        tests:
          - accepted_values:
              arguments:
                values:
                  - 'no heart rate data'
                  - 'average HR outside 90–200 bpm sanity band'
                  - 'pace outside 4.0–20.0 min/mi bounds'
                  - 'moving time under 15 minutes'

  - name: int_run_stream_samples
    description: >
      One row per successfully loaded activity and aligned sample index:
      the raw parallel stream arrays (time / heartrate / velocity_smooth
      / moving / grade_smooth) unnested by shared index, so downstream
      SQL reads samples relationally. is_valid_sample marks
      instrument-sane samples (HR 25–250 bpm as in staging, velocity
      0–12 m/s); invalid samples are excluded from drift halves and
      heavy invalidity surfaces as a coverage failure, never as
      poisoned averages.
    columns:
      - name: activity_id
        description: Strava activity id (streams stored successfully).
        tests: [not_null]
      - name: sample_index
        description: Zero-based position in the aligned arrays.
        tests: [not_null]
      - name: elapsed_s
        description: Seconds since activity start (the time stream).
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 0}
      - name: hr_bpm
        description: Instantaneous heart rate; NULL when the sample carries none.
      - name: velocity_m_per_s
        description: Smoothed velocity; NULL when the sample carries none.
      - name: is_moving
        description: Strava's moving flag; false also when the sample omits it.
        tests: [not_null]
      - name: grade_pct
        description: Smoothed grade; context only, not used in drift math.
      - name: is_valid_sample
        description: HR and velocity both present and instrument-sane.
        tests: [not_null]

  - name: int_run_stream_state
    description: >
      One row per stream-fetch attempt (activity grain —
      raw_strava.streams is keyed by activity_id): the fetch status and
      whether the payload carries the arrays drift analysis requires.
      Exists so fct_drift_candidates can distinguish "never fetched" /
      "unavailable" / "failed" / "arrays missing" without reading the
      raw source from core — raw_strava.streams is readable from
      intermediate models ONLY (Revision v1.2 follow-up).
    columns:
      - name: activity_id
        description: Strava activity id (one row per fetch attempt).
        tests: [unique, not_null]
      - name: ingestion_status
        description: >
          success (payload stored) / unavailable (Strava has no
          streams — terminal) / failed (transient, retried by the next
          backfill).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['success', 'failed', 'unavailable']
      - name: has_required_arrays
        description: >
          The payload carries the time, heartrate, and velocity_smooth
          arrays drift analysis requires. Never NULL — the raw payload
          column is NOT NULL ({} for failed/unavailable rows).
        tests: [not_null]

  - name: int_band_window_samples
    description: >
      One row per activity and pooled stream sample (D22, v1.4): the
      valid, moving samples inside the band analysis window (elapsed
      time trimmed by band_warmup_trim_minutes /
      band_cooldown_trim_minutes), each carrying its HR band from the
      hr_bands seed (joined by range on round(hr_bpm) via the
      hr_band_range macro — the sanctioned seed read from intermediate,
      v1.4's single layer-matrix widening) and its dwell contribution:
      least(gap to the previous kept sample, drift_max_avg_sample_gap_s)
      seconds, so recording gaps never inflate dwell. Pauses are simply
      dropped from the pool — unlike drift's time-based halves they
      cannot bias band medians, so there is deliberately no pause rung
      downstream.
    columns:
      - name: activity_id
        description: Strava activity id.
        tests: [not_null]
      - name: band_key
        description: The sample's HR band (hr_bands seed key).
        tests: [not_null]
      - name: dwell_s
        description: Capped per-sample dwell contribution, seconds.
        tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 0, max_value: 3}
      - name: velocity_m_per_s
        description: Smoothed velocity (valid samples only, so 0-12).
        tests: [not_null]

  - name: int_run_band_assessment
    description: >
      One row per D22 band candidate (HR-carrying run at or past the
      stream FETCH gate, stream_fetch_min_moving_minutes — D15 revised
      v1.4): window stats and the band exclusion ladder, encoded ONCE
      here so both core band models consume one verdict
      (fct_band_candidates projects it; fct_run_band_segments filters
      on it) — the int_run_efficiency pattern, avoiding any core ->
      core edge. The ladder reports the FIRST failing check in
      dependency order: stream availability -> required arrays ->
      window length (pooled moving dwell vs band_min_window_minutes) ->
      sample coverage (drift's mechanism and cap, reused) -> dwell
      minimum (no band reaches band_min_dwell_minutes).
    columns:
      - name: activity_id
        description: Strava activity id (one row per band candidate).
        tests: [unique, not_null]
      - name: pooled_moving_dwell_min
        description: >
          Minutes of pooled moving material inside the trimmed window
          (sum of capped per-sample dwell) — the ladder's "window
          length" input. 0.0, never NULL, when no samples reach the
          pool.
        tests: [not_null]
      - name: qualifying_band_count
        description: >
          Bands whose dwell reaches band_min_dwell_minutes; 0, never
          NULL, when streams are absent.
        tests: [not_null]
      - name: exclusion_reason
        description: >
          NULL when analyzed; otherwise the first failing D22 check.
          Threshold values are rendered from the same dbt vars the
          checks use, so reasons can never disagree with behavior.
        tests:
          - accepted_values:
              arguments:
                values:
                  - 'streams not yet loaded'
                  - 'streams unavailable from Strava'
                  - 'stream fetch failed (retried by next backfill)'
                  - 'missing required stream types'
                  - 'analysis window under 10 minutes after trimming'
                  - 'insufficient sample coverage'
                  - 'no band meets the dwell minimum'


  - name: int_rides_with_weather
    description: >
      One row per D23 ride (the ride_sport_types var — e-bike types
      never enter; same grain fct_rides inherits), joined to the
      NEAREST qualifying hourly observation at the ride's normalized D7
      cell, exactly as int_runs_with_weather does for runs. is_indoor
      (trainer or VirtualRide) rides get a NULL location_key BY
      CONSTRUCTION, so they are permanently unmatched with NULL weather
      — deliberately stronger than the running side (v2.0 Phase C1).
      Missing stays distinguishable from zero.
    columns:
      - name: activity_id
        description: Strava activity id (one row per D23 ride).
        tests: [unique, not_null]
      - name: is_indoor
        description: >
          Trainer flag OR VirtualRide sport type. Indoor rides can
          never weather-match (their cell is NULL by construction).
        tests: [not_null]
      - name: location_key
        description: >
          The ride's normalized ~1.1 km cell (D7); NULL for indoor
          rides (by construction) and rides without GPS coordinates.
      - name: weather_match_minutes
        description: >
          Minutes between the ride start and the matched observation
          hour; NULL when no observation exists at the cell.
        tests:
          - accepted_range:
              arguments: {min_value: 0}
      - name: weather_matched
        description: True only when a qualifying observation lies within 60 minutes.
        tests: [not_null]

  - name: int_ride_measures
    description: >
      One row per D23 ride — the ride-level computation layer (v2.0
      Phase C1): derived measures (distance mi, moving time, guarded
      average speed mph re-derived from distance and time, calendar
      fields) and the ride's D25 validity verdict. is_valid is DEFINED
      as (exclusion_reason is null); the exclusion ladder is the single
      encoding of the rules (first failing rule: HR sanity when HR is
      present, speed bounds, minimum duration). HR ABSENCE is
      deliberately not a rung — D25 requires HR only for HR-based
      aggregates, never for the grain; HR and cadence columns simply
      stay NULL. Invalid rides are never silently filtered. Feeds
      fct_rides, core's explicit-column projection.
    columns:
      - name: activity_id
        description: Strava activity id (one row per D23 ride).
        tests: [unique, not_null]
      - name: avg_speed_mph
        description: >
          Average moving speed re-derived as distance_mi / moving
          hours; NULL when distance or moving time is zero — missing,
          never zero. Sanity-bounded by the D25 ladder, not a test:
          out-of-bounds values stay visible with their reason.
      - name: average_cadence_rpm
        description: Average crank rpm when the source recorded it (D26); NULL otherwise.
      - name: is_valid
        description: >
          The ride counts toward weekly cycling statistics (D25
          data-validity rules only; thresholds as dbt vars).
        tests: [not_null]
      - name: exclusion_reason
        description: >
          NULL when valid; otherwise the first failing D25 rule.
          Threshold values are rendered from the same dbt vars the flag
          logic uses, so reasons can never disagree with behavior.
        tests:
          - accepted_values:
              arguments:
                values:
                  - 'average HR outside 90–200 bpm sanity band'
                  - 'average speed outside 3–35 mph bounds'
                  - 'moving time under 15 minutes'

  - name: int_segment_geometry
    description: >
      One row per Strava segment (v2.0 Phase C3, D30): great-circle
      initial bearing from the segment's start to end coordinates
      (staging-only fields of stg_strava__segments), haversine
      straight-line distance, sinuosity (segment distance / straight
      line, 4 dp), and winding_segment — strictly above
      winding_sinuosity_max (a sinuosity of exactly the bound is NOT
      winding; guarded by
      assert_segment_geometry_winding_matches_threshold). The flag is
      a displayed caveat — the straight-line bearing misdescribes a
      winding course — never a filter. Unknown geometry (missing or
      identical endpoints, where bearing is undefined and the
      sinuosity division impossible) stays NULL, never false.
    columns:
      - name: segment_id
        description: Strava segment id (one row per segment).
        tests: [unique, not_null]
      - name: bearing_deg
        description: >
          Great-circle initial bearing start → end, degrees (0 =
          north, 1 dp); NULL when endpoints are missing or identical
          (Postgres answers atan2(0, 0) with 0, which would silently
          claim due north — hence the explicit guard).
        tests:
          - accepted_range:
              arguments: {min_value: 0, max_value: 360}
      - name: straight_line_m
        description: >
          Haversine start-to-end distance, meters, unrounded (IUGG
          mean radius 6371008.8 m, pinned in the haversine_meters
          macro). Intermediate-only fuel for sinuosity.
      - name: sinuosity
        description: >
          distance_m / straight_line_m, 4 dp; NULL when the straight
          line is zero or unknown.
      - name: winding_segment
        description: >
          sinuosity strictly above winding_sinuosity_max (D30); NULL
          when geometry is unknown — missing is not "not winding".

  - name: int_segment_efforts
    description: >
      One row per Strava segment effort on a D23 ride (v2.0 Phase C2,
      D24) — the effort-level context layer: staged effort + its
      segment's identity + the parent ride's calendar, validity, and
      matched weather from int_ride_measures. The INNER join applies
      the D23 grain by construction; raw efforts whose parent ride
      later leaves the grain (e.g. a sport_type edited in Strava after
      the detail fetch) drop via that join — a grain rule, not an
      exclusion needing a reason. is_virtual_ride encodes D28's mart
      holdout (VIRTUAL, deliberately not is_indoor: trainer-flagged
      outdoor ride types keep their efforts in marts). No D25 gating of
      efforts — ride_is_valid / ride_exclusion_reason are carried as
      displayed caveats, never filters. Weather column names are kept
      verbatim from the ride chain; C3 (D30) added its effort_* wind
      columns beside them exactly as reserved — segment geometry from
      int_segment_geometry, plus the effort-hour wind match: nearest
      qualifying observation at the parent ride's start cell to the
      EFFORT's start time (60-minute rule; deterministic tie-break, a
      deliberate deviation from the ride model's unspecified — and
      frozen — tie order), and the D30 headwind/crosswind computed
      where speed, direction, and bearing all exist (positive =
      headwind, the pinned sign). Feeds fct_segment_efforts, core's
      explicit-column projection.
    columns:
      - name: effort_id
        description: Strava segment-effort id (one row per effort).
        tests: [unique, not_null]
      - name: is_virtual_ride
        description: >
          Parent ride sport_type = 'VirtualRide' — the D28 holdout flag
          (efforts kept in core, excluded from segment marts).
        tests: [not_null]
      - name: ride_is_valid
        description: Parent ride's D25 verdict, as displayed context.
        tests: [not_null]
      - name: ride_exclusion_reason
        description: >
          Parent ride's first failing D25 rule; NULL when the ride is
          valid. A caveat on the effort's times, never a filter.
