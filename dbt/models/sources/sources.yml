version: 2

sources:
  - name: raw_strava
    description: >
      Raw Strava ingestion layer (Phase 1). Full API payloads in JSONB
      with sync-critical fields promoted to typed columns; one row per
      activity, idempotently upserted.
    schema: raw_strava
    tables:
      - name: activities
        description: >
          One row per Strava activity of any sport type (the run filter
          is a staging concern, not an ingestion one). payload holds the
          complete SummaryActivity JSON.
        loaded_at_field: fetched_at
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 30, period: day}
        columns:
          - name: activity_id
            description: Strava activity id (primary key).
            tests: [unique, not_null]
          - name: start_date_utc
            description: Activity start as timestamptz (UTC).
            tests: [not_null]
          - name: payload
            description: Complete API response, unmodified.
            tests: [not_null]
      - name: sync_state
        description: Per-job sync watermarks (Phase 1); not modeled downstream.
      - name: activity_coordinates
        description: >
          Resolved run-start coordinate per activity with explicit
          provenance: start_latlng from the payload, map_polyline decoded
          from the detail endpoint (the map-privacy fallback), or an
          explicit unavailable row. Absent row = not yet attempted.
        columns:
          - name: activity_id
            description: Strava activity id (one resolution per activity).
            tests: [unique, not_null]
          - name: source
            description: start_latlng / map_polyline / unavailable.
            tests:
              - not_null
              - accepted_values:
                  arguments: {values: [start_latlng, map_polyline, unavailable]}
      - name: streams
        description: >
          One row per attempted stream fetch (Phase 5). success = full
          key_by_type payload stored; unavailable = Strava has no
          streams for the activity (terminal); failed = transient error,
          retried by the next backfill. An absent row means not yet
          attempted — the three states stay distinguishable.
        columns:
          - name: activity_id
            description: Strava activity id (one attempt row per activity).
            tests: [unique, not_null]
          - name: ingestion_status
            description: success / failed / unavailable (CHECK-constrained).
            tests:
              - not_null
              - accepted_values:
                  arguments: {values: [success, failed, unavailable]}
      - name: activity_details
        description: >
          One row per attempted activity-detail fetch (Phase C2, D24:
          GET /activities/{id}?include_all_efforts=true, D23 rides
          only). success = full DetailedActivity stored and its efforts
          extracted; unavailable = the activity no longer exists on
          Strava (terminal); failed = transient error, retried by the
          next run. An absent row means not yet attempted — the status
          rows are the resumability mechanism; there is no watermark.
          Estimated power lives only inside this payload, modeled
          nowhere (D27).
        columns:
          - name: activity_id
            description: Strava activity id (one attempt row per activity).
            tests: [unique, not_null]
          - name: ingestion_status
            description: success / failed / unavailable (CHECK-constrained).
            tests:
              - not_null
              - accepted_values:
                  arguments: {values: [success, failed, unavailable]}
      - name: segment_efforts
        description: >
          One row per Strava segment effort (Phase C2, D24), extracted
          from the parent ride's detail payload in the same transaction
          as its status row and upserted by effort_id — re-fetching a
          ride replaces its efforts in place, so re-runs never
          duplicate.
        columns:
          - name: effort_id
            description: Strava segment-effort id (primary key).
            tests: [unique, not_null]
          - name: activity_id
            description: Parent activity id.
            tests: [not_null]
          - name: segment_id
            description: Strava segment id.
            tests: [not_null]
          - name: payload
            description: >
              Full DetailedSegmentEffort JSON, nested segment summary
              included.
            tests: [not_null]
      - name: segments
        description: >
          One row per Strava segment (Phase C2, D24), upserted from the
          summary nested in each effort. Shared across activities; last
          write wins — the newest fetch's summary replaces the payload.
        columns:
          - name: segment_id
            description: Strava segment id (primary key).
            tests: [unique, not_null]
          - name: payload
            description: Nested segment summary JSON from the newest fetch.
            tests: [not_null]

  - name: raw_weather
    description: >
      Raw Open-Meteo hourly archive layer (Phase 2). One row per 2-dp
      coordinate cell and UTC hour; the table doubles as the fetch
      cache. NULL measurements mean the archive had no data for that
      hour — missing, never zero.
    schema: raw_weather
    tables:
      - name: hourly
        description: >
          Hourly observations keyed by (location_key, weather_timestamp).
          Currently empty until the first outdoor GPS run exists — that
          is expected, not a defect (all history to date is indoor).
        loaded_at_field: fetched_at
        # Freshness intentionally not enforced here: rows only appear
        # when outdoor runs exist, so an empty/quiet table is normal and
        # a calendar-based freshness alarm would only produce noise.
        columns:
          - name: location_key
            description: "Normalized ~1.1 km cell per D7: '{lat_2dp}_{lon_2dp}'."
            tests: [not_null]
          - name: weather_timestamp
            description: UTC start of the observation hour.
            tests: [not_null]
